name: Feature request
description: Suggest a new relic, curse, weapon, ritual, config option, or mod compatibility.
title: "[Suggestion] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like to see added or changed?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why?
      description: How would it make the Oath more interesting, fair, or fun?
  - type: dropdown
    id: loader
    attributes:
      label: Loader you play on
      multiple: true
      options:
        - NeoForge
        - Fabric
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Sketches, lore, or related mods.
